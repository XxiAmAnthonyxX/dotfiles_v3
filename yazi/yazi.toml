# ~/.config/yazi/yazi.toml
# Optimized for Kitty + TUI/CLI workflow (no git)

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true
linemode       = "size_and_mtime"
show_hidden    = true
show_symlink   = true
scrolloff      = 8
mouse_events   = ["click", "scroll", "drag"]
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1200
max_height    = 1500
image_delay   = 30
image_filter  = "lanczos3"
image_quality = 80
cache_dir     = ""

[opener]

edit = [
    { run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]

play = [
    { run = 'mpv --force-window=immediate %s', desc = "mpv", orphan = true, for = "unix" },
]

image = [
    { run = 'imv %s', desc = "imv", orphan = true, for = "unix" },
]

open = [
    { run = 'xdg-open %s', desc = "xdg-open", orphan = true, for = "unix" },
]

reveal = [
    { run = 'xdg-open %d1', desc = "Reveal", orphan = true, for = "unix" },
]

extract = [
    { run = 'ouch decompress %s', desc = "Extract (ouch)", block = true, for = "unix" },
]

compress = [
    { run = 'ouch compress %s archive.zip', desc = "Compress → archive.zip", block = true, for = "unix" },
]

hex = [
    { run = 'hexyl %s', desc = "hexyl", block = true, for = "unix" },
]

mediainfo = [
    { run = 'mediainfo %s', desc = "mediainfo", block = true, for = "unix" },
]

exif = [
    { run = 'exiftool %s', desc = "exiftool", block = true, for = "unix" },
]

[open]
# First matching rule wins. Order matters.
prepend_rules = [
	# Images → imv
	{ mime = "image/*", use = ["image", "open", "exif"] },
	# Video / audio → mpv
	{ mime = "{audio,video}/*", use = ["play", "open", "mediainfo"] },
	# Archives → extract
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "open"] },
	{ url = "*.{zip,tar,gz,tgz,bz2,xz,7z,rar,zst}", use = ["extract", "open"] },
	# PDF
	{ mime = "application/pdf", use = ["open"] },
	# Text / code → nvim
	{ mime = "text/*", use = ["edit"] },
	{ mime = "application/json", use = ["edit"] },
	{ mime = "application/javascript", use = ["edit"] },
	{ mime = "application/x-*-script", use = ["edit"] },
	{ url = "*.{lua,toml,yml,yaml,md,json,nix,qml,conf,ini,css,scss,html,rs,go,c,h,cpp,hpp,py,sh,bash,fish}", use = ["edit"] },
	# Fallback
	{ url = "*", use = ["open", "edit", "hex"] },
]

[plugin]
# Previewers (first match wins). Visual media still uses Yazi built-ins
# (Kitty image protocol, ffmpegthumbnailer, poppler, resvg).
prepend_previewers = [
	# Markdown → glow
	{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
	# JSON → jq (pretty + color)
	{ mime = "application/json", run = 'piper -- jq -C . "$1"' },
	{ url = "*.json", run = 'piper -- jq -C . "$1"' },
	# Text / code → bat
	{ mime = "text/*", run = 'piper -- bat -p --color=always --style=plain --terminal-width=$w "$1"' },
	{ mime = "application/javascript", run = 'piper -- bat -p --color=always --style=plain --terminal-width=$w "$1"' },
	{ url = "*.{lua,toml,yml,yaml,nix,qml,conf,ini,css,scss,html,rs,go,c,h,cpp,hpp,py,sh,bash,fish,ts,tsx,jsx,vue,xml,svg}", run = 'piper -- bat -p --color=always --style=plain --terminal-width=$w "$1"' },
	# Directories → eza tree (no git)
	{ url = "*/", run = 'piper -- eza -TL=3 --color=always --icons --group-directories-first --no-user --no-time --no-permissions "$1"' },
	# Archives → ouch list
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = 'piper -- ouch list "$1"' },
	{ url = "*.{zip,tar,gz,tgz,bz2,xz,7z,rar,zst}", run = 'piper -- ouch list "$1"' },
	# Binary / unknown → hexyl
	{ mime = "application/octet-stream", run = 'piper -- hexyl --border none "$1"' },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 3
image_alloc   = 536870912  # 512 MB
